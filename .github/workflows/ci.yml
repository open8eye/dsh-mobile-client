name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 8.12, shipped with Flutter 3.35, does not support JDK 24+.
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          # The shim check is differential: it deletes the real implementation
          # and compares against ours, so it needs a Node that has them all.
          node-version: '24'

      - name: Check the browser shims against the real APIs
        run: node tools/compat_check.mjs

      - name: Check the onboarding guard against a stub page
        run: node tools/onboarding_check.mjs

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # Building here as well as in Release catches a broken Android build on
      # the pull request that broke it, not on the day of a release.
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --flavor standard

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-client-apk
          # --flavor standard names the output after the flavour. Pointing at
          # app-release.apk made every run fail here, with a green analyze,
          # test and build behind it — which reads like flaky infrastructure
          # rather than a wrong path.
          path: app/build/app/outputs/flutter-apk/app-standard-release.apk
          if-no-files-found: error
