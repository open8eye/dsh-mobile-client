name: Release

# Publishing is driven entirely by the tag: push `v1.2.0` and the APK lands on
# both GitHub and Gitee, which is what the in-app updater reads.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITEE_REPO: ${{ vars.GITEE_REPO }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      # Refuse to publish an APK signed with the debug key. Every runner mints
      # its own debug key, and Android will not install over an app signed by a
      # different one — the user is asked to uninstall, which also costs them
      # their device list and the access PIN. A release that cannot be installed
      # as an update is not a release.
      DSH_REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Check the tag against pubspec
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=dsh-mobile-client-$version.apk" >> "$GITHUB_OUTPUT"
          echo "legacy=dsh-mobile-client-$version-legacy.apk" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze and test
        working-directory: app
        run: |
          flutter analyze
          flutter test

      # The keystore is never committed. It travels as base64 in a secret and is
      # written to the git-ignored app/android/key.properties, which
      # app/build.gradle.kts reads. See docs/RELEASING.md §六.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::missing signing secrets — set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (docs/RELEASING.md §六)"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          # java.util.Properties treats a backslash as an escape character, so a
          # password containing one would fail as "keystore was tampered with".
          escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }

          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$(escape "$KEYSTORE_PASSWORD")"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$(escape "$KEY_PASSWORD")"
          } > app/android/key.properties

          echo "signing keystore installed: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"

      # Two builds from one codebase, published side by side. The in-app updater
      # tells them apart by name and never crosses them over.
      #
      # `standard` is the small app that reuses a newer WebView kernel already
      # installed on the phone. `legacy` carries its own Chromium and is built
      # 32-bit to match it, so it works on a device with nothing newer.
      # The Gitee half is only overridden when GITEE_REPO actually says
      # something. Falling back to github.repository looked harmless and was
      # not: the two owners are different, so an unconfigured run baked a dead
      # Gitee channel into the APK and reported the host as unreachable
      # forever after. Leaving the define out lets the app's own default —
      # which knows the real address — apply instead.
      - name: Build the standard APK
        working-directory: app
        run: |
          set -euo pipefail
          defines=("--dart-define=DSH_GITHUB_REPO=${{ github.repository }}")
          if [ -n "${{ vars.GITEE_REPO }}" ]; then
            defines+=("--dart-define=DSH_GITEE_REPO=${{ vars.GITEE_REPO }}")
          fi
          flutter build apk --release --flavor standard "${defines[@]}"

      # ~85 MB, so it is fetched here rather than committed. The legacy build
      # needs the asset to exist; without it the flavour would produce an APK
      # that cannot do the one thing it is for.
      - name: Fetch the bundled WebView kernel
        run: ./tools/fetch_webview_kernel.sh

      - name: Build the legacy APK
        working-directory: app
        run: |
          set -euo pipefail
          defines=("--dart-define=DSH_GITHUB_REPO=${{ github.repository }}")
          if [ -n "${{ vars.GITEE_REPO }}" ]; then
            defines+=("--dart-define=DSH_GITEE_REPO=${{ vars.GITEE_REPO }}")
          fi
          flutter build apk --release --flavor legacy --target-platform android-arm \
            "${defines[@]}"

      - name: Collect the artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-standard-release.apk \
             "dist/${{ steps.version.outputs.asset }}"
          cp app/build/app/outputs/flutter-apk/app-legacy-release.apk \
             "dist/${{ steps.version.outputs.legacy }}"
          ls -la dist

      # The fingerprint belongs in the log: comparing it between releases is how
      # "why is this update asking me to uninstall?" gets answered at a glance.
      - name: Verify the release signature
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            echo "--- $apk"
            "$apksigner" verify --print-certs "$apk" |
              grep -E 'Signer #1 certificate (DN|SHA-256)' || true
          done

      - name: Write the release notes
        run: |
          set -euo pipefail
          # An annotated tag carries hand-written notes; a lightweight tag falls
          # back to the commit message, which is better than nothing.
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > dist/notes.md
          fi
          echo "--- notes ---"; cat dist/notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/notes.md
          files: dist/*.apk

      # Gitee has no hosted runner on the free tier, so GitHub builds once and
      # mirrors the result. Skipped silently when the secrets are not set.
      - name: Mirror the release to Gitee
        if: env.GITEE_TOKEN != ''
        run: |
          set -euo pipefail
          if [ -z "${GITEE_REPO:-}" ]; then
            echo "::error::set the GITEE_REPO repository variable (owner/name)"
            exit 1
          fi

          # The tag normally reaches Gitee from the developer's own push, so
          # this is a fallback and "it is already there" is not a failure.
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "refs/tags/${GITHUB_REF_NAME}" \
            || echo "::warning::could not push the tag to Gitee; assuming it is already there"

          # Deliberately NOT `curl -f`. The response body is the only place
          # Gitee says *why* it refused — missing scope on the token, wrong
          # repository, a release that already exists. With -f every one of
          # those collapses into "exit code 22", which is unactionable from a
          # CI log and is exactly how this step failed the first time.
          response=$(curl -sS -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
            -d "access_token=${GITEE_TOKEN}" \
            -d "tag_name=${GITHUB_REF_NAME}" \
            -d "name=${GITHUB_REF_NAME}" \
            -d "target_commitish=${GITHUB_REF_NAME}" \
            --data-urlencode "body@dist/notes.md" || true)
          release_id=$(printf '%s' "$response" | jq -r '.id // empty' 2>/dev/null || true)

          if [ -z "$release_id" ]; then
            echo "::error::Gitee refused the release: $response"
            exit 1
          fi

          for asset in "dist/${{ steps.version.outputs.asset }}" "dist/${{ steps.version.outputs.legacy }}"; do
            attached=$(curl -sS -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${asset}" || true)
            echo "attach ${asset}: $(printf '%s' "$attached" | head -c 300)"
          done

          echo "mirrored to https://gitee.com/${GITEE_REPO}/releases"
