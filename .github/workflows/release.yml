name: Release

# Publishing is driven entirely by the tag: push `v1.2.0` and the APK lands on
# both GitHub and Gitee, which is what the in-app updater reads.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITEE_REPO: ${{ vars.GITEE_REPO }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Check the tag against pubspec
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=dsh-mobile-client-$version.apk" >> "$GITHUB_OUTPUT"
          echo "legacy=dsh-mobile-client-$version-legacy.apk" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze and test
        working-directory: app
        run: |
          flutter analyze
          flutter test

      # Two builds from one codebase, published side by side. The in-app updater
      # tells them apart by name and never crosses them over.
      #
      # `standard` is the small app that reuses a newer WebView kernel already
      # installed on the phone. `legacy` carries its own Chromium and is built
      # 32-bit to match it, so it works on a device with nothing newer.
      - name: Build the standard APK
        working-directory: app
        run: |
          flutter build apk --release --flavor standard \
            --dart-define=DSH_GITHUB_REPO=${{ github.repository }} \
            --dart-define=DSH_GITEE_REPO=${{ vars.GITEE_REPO || github.repository }}

      # ~85 MB, so it is fetched here rather than committed. The legacy build
      # needs the asset to exist; without it the flavour would produce an APK
      # that cannot do the one thing it is for.
      - name: Fetch the bundled WebView kernel
        run: ./tools/fetch_webview_kernel.sh

      - name: Build the legacy APK
        working-directory: app
        run: |
          flutter build apk --release --flavor legacy --target-platform android-arm \
            --dart-define=DSH_GITHUB_REPO=${{ github.repository }} \
            --dart-define=DSH_GITEE_REPO=${{ vars.GITEE_REPO || github.repository }}

      - name: Collect the artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-standard-release.apk \
             "dist/${{ steps.version.outputs.asset }}"
          cp app/build/app/outputs/flutter-apk/app-legacy-release.apk \
             "dist/${{ steps.version.outputs.legacy }}"
          ls -la dist

      - name: Write the release notes
        run: |
          set -euo pipefail
          # An annotated tag carries hand-written notes; a lightweight tag falls
          # back to the commit message, which is better than nothing.
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > dist/notes.md
          fi
          echo "--- notes ---"; cat dist/notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/notes.md
          files: dist/*.apk

      # Gitee has no hosted runner on the free tier, so GitHub builds once and
      # mirrors the result. Skipped silently when the secrets are not set.
      - name: Mirror the release to Gitee
        if: env.GITEE_TOKEN != ''
        run: |
          set -euo pipefail
          if [ -z "${GITEE_REPO:-}" ]; then
            echo "::error::set the GITEE_REPO repository variable (owner/name)"
            exit 1
          fi

          # The tag has to exist on Gitee too, or the release has nothing to
          # point at.
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "refs/tags/${GITHUB_REF_NAME}"

          release_id=$(curl -sSf -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
            -d "access_token=${GITEE_TOKEN}" \
            -d "tag_name=${GITHUB_REF_NAME}" \
            -d "name=${GITHUB_REF_NAME}" \
            -d "target_commitish=${GITHUB_SHA}" \
            --data-urlencode "body@dist/notes.md" | jq -r '.id')

          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "::error::Gitee did not return a release id"
            exit 1
          fi

          for asset in "dist/${{ steps.version.outputs.asset }}" "dist/${{ steps.version.outputs.legacy }}"; do
            curl -sSf -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${asset}"
          done

          echo "mirrored to https://gitee.com/${GITEE_REPO}/releases"
